# Offline network hardening for the grafana container: pointing the
# resolver at the container's own loopback makes every DNS lookup fail,
# so any outbound request (plugin/update checks, telemetry, gravatar,
# snapshots, ...) cannot resolve a host name.
#
# There is no DNS server listening on 127.0.0.1 inside the container, so
# lookups fail immediately instead of timing out.
#
# Mounted read-only over the container's /etc/resolv.conf by
# docker/systemd/grafana.service. Install on the host at:
#   /etc/grafana/offline-resolv.conf
nameserver 127.0.0.1
