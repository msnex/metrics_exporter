[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
lexical = "7.0.5"
opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.1", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", features = ["metrics"] }
serde = "1.0.229"
thiserror = "2.0.20"
time = "0.3.55"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2"

[package]
name = "metrics_exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
procfs = { path = "./crates/procfs" }
serde = { workspace = true, features = ["derive"] }
time = { workspace = true, features = ["macros"] }
tracing = { workspace = true, features = ["log"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "local-time"] }

[profile.dev]
opt-level = 0
debug = "full"
panic = "abort"

[profile.release]
opt-level = 2
debug = "none"
panic = "abort"
