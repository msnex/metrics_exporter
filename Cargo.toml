[workspace]
resolver = "3"
members = ["crates/*", "exporter"]

[workspace.dependencies]
anyhow = "1.0.104"
log = "0.4.33"
opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.1", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", features = ["metrics"] }
serde = "1.0.229"
time = "0.3.55"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2"

[profile.dev]
opt-level = 0
debug = 1
panic = "abort"

[profile.release]
opt-level = 2
debug = "none"
panic = "abort"
